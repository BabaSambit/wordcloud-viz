<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Cloud</title>

  <!-- Google Font: Sora (default) — others load via Looker Studio font picker -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- D3 v5 (compatible with d3-cloud) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@5/dist/d3.min.js"></script>

  <!-- d3-cloud word layout -->
  <script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.7/build/d3.layout.cloud.min.js"></script>

  <!-- Looker Studio Community Viz helper -->
  <script src="https://cdn.jsdelivr.net/npm/@google/dscc@0.3.18/dist/dscc.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Sora', sans-serif;
      background: transparent;
    }

    #wordcloud {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #wordcloud svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    #wordcloud text {
      transition: opacity 0.15s;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="wordcloud"></div>
  <script src="wordcloud.js"></script>
</body>
</html>
